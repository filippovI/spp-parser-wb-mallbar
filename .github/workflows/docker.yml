name: build-and-push

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Включаем Buildx с драйвером docker-container, иначе registry cache не работает
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver: docker-container

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract project version
        id: meta
        run: |
          VER=$(grep -m1 -E '<version>.*</version>' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Build and push (Dockerfile сам собирает JAR внутри)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            filippovi/spp-parser-wb-mallbar:latest
            filippovi/spp-parser-wb-mallbar:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=filippovi/spp-parser-wb-mallbar:buildcache
          cache-to: type=registry,ref=filippovi/spp-parser-wb-mallbar:buildcache,mode=max
name: build-and-push

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract project version
        id: meta
        run: |
          VER=$(grep -m1 -E '<version>.*</version>' pom.xml | sed -E 's/.*<version>([^<]+)<\/version>.*/\1/')
          echo "version=$VER" >> $GITHUB_OUTPUT

      - name: Build and push (multi-stage Dockerfile builds JAR inside)
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            filippovi/spp-parser-wb-mallbar:latest
            filippovi/spp-parser-wb-mallbar:${{ steps.meta.outputs.version }}
          cache-from: type=registry,ref=filippovi/spp-parser-wb-mallbar:buildcache
          cache-to: type=registry,ref=filippovi/spp-parser-wb-mallbar:buildcache,mode=max